<div class="skeleton" role="status" aria-label="Cargando artículo">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="skeleton-content">
        <div class="skeleton-block skeleton-title" aria-hidden="true"></div>

        <figure class="skeleton-featured">
          <div class="skeleton-block skeleton-image" aria-hidden="true"></div>
          <div class="skeleton-block skeleton-caption" aria-hidden="true"></div>
        </figure>

        <div class="skeleton-meta">
          <div class="skeleton-author">
            <div class="skeleton-block skeleton-avatar" aria-hidden="true"></div>
            <div class="skeleton-author-lines">
              <div class="skeleton-block skeleton-line name" aria-hidden="true"></div>
              <div class="skeleton-block skeleton-line date" aria-hidden="true"></div>
            </div>
          </div>

          <div class="skeleton-tags" aria-hidden="true">
            <div class="skeleton-block skeleton-tag tag-short"></div>
            <div class="skeleton-block skeleton-tag tag-medium"></div>
            <div class="skeleton-block skeleton-tag tag-long"></div>
          </div>
        </div>

        <div class="skeleton-text" aria-hidden="true">
          <div class="skeleton-paragraph">
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line line-short"></div>
          </div>
          <div class="skeleton-paragraph">
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line line-medium"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
