  <app-navbar [actions]=actions></app-navbar>

  <main class="main-banner" id="top">
    <div class="container" >
      <ng-container *ngIf="post; else skeleton">
      <article class="post-container" *ngIf="post.content">
          <div class="row justify-content-center">
            <div class="col-lg-8">
              <div class="header-text">
                <div class="content text-center">
                  <header class="post-header">
                    <h1 class="post-title">{{post.title}}</h1>
                    <figure>
                      <img [src]="post.featuredImage.image" [alt]="post.featuredImage.title" class="img-fluid">
                      <figcaption>{{post.featuredImage.title}} - {{post.featuredImage.description}} </figcaption>
                    </figure>
                    <div class="row mt-4">
                      <div id="author-container" class="col-12 col-md-6 col-lg-6 d-flex">
                        <img [src]="post.author.profileImage.image" class="author-photo rounded-circle"
                          alt="{{ post.author.name }}">
                        <div class="author-info ms-3">
                          <p class="author-name mb-0"><a [routerLink]="['/profile', post.author.id]">{{ post.author.name }}</a></p>
                          <p class="author"><relative-time [attr.datetime]="post.updatedDate.toISOString()" format="relative" tense="past" time-zone="Europe/Madrid"> {{post.updatedDate}} </relative-time></p>
                        </div>
                      </div>
                      <div id="chips-container" class="col-12 col-md-6 col-lg-6 d-flex tags">
                        <ng-container *ngFor="let tag of post.tags">
                          <div class="chip">
                            {{tag}}
                          </div>
                        </ng-container>
                      </div>
                    </div>
                  </header>
                  <div class="article-body mt-4" [innerHTML]="post.content | mdToHtml"></div>
                </div>
              </div>
            </div>
          </div>
        </article>
      </ng-container>
      <ng-template #skeleton>
        <app-post-skeleton></app-post-skeleton>
      </ng-template>
      </div>
  </main>

  <div id="about" class="about-us section">
    <div class="container">
      <div class="row">
        <div class="col-lg-4">
          <div class="left-image wow fadeIn" data-wow-duration="1s" data-wow-delay="0.2s">
            <img src="assets/images/about-left-image.png" alt="person graphic">
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-footer></app-footer>
